<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-box"></div>
            <span class="logo-text">Nama Website</span>
        </div>
        <nav>
            <a href="index.html">Beranda</a>
            <a href="login.html" class="active">Login</a>
            <a href="daftar.html">Daftar</a>
        </nav>
    </header>

    <main>
        <form action="profil.html" method="GET">
            <fieldset>
                <legend>Login</legend>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember" style="width: auto;">Remember me</label>
                </div>

                <div class="btn-container" style="justify-content: flex-start; margin-left: 140px;">
                    <button type="submit" class="btn">Login</button>
                    <a href="index.html" class="btn">Kembali</a>
                </div>
            </fieldset>
        </form>
    </main>

    <footer>
        <div>© 2026 FIRA AMALIA PUTRI - 2557401010 · Kelas MI 25</div>
        <div>
            <a href="#">Instagram</a>
            <a href="#">Email</a>
        </div>
    </footer>

</body>
</html>
