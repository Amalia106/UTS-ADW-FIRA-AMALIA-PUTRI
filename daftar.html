<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Daftar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-box"></div>
            <span class="logo-text">Nama Website</span>
        </div>
        <nav>
            <a href="index.html">Beranda</a>
            <a href="login.html">Login</a>
            <a href="daftar.html" class="active">Daftar</a>
        </nav>
    </header>

    <main>
        <h1>Daftar</h1>
        
        <form action="login.html" method="GET">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="ulang_password">Ulangi Password</label>
                <input type="password" id="ulang_password" name="ulang_password" required>
            </div>

            <div class="form-group">
                <label for="nama_lengkap">Nama Lengkap</label>
                <input type="text" id="nama_lengkap" name="nama_lengkap" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat</label>
                <textarea id="alamat" name="alamat"></textarea>
            </div>

            <div class="form-group">
                <label for="telepon">Nomor Telepon</label>
                <input type="tel" id="telepon" name="telepon">
            </div>

            <div class="form-group">
                <label>Jenis Kelamin</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="Laki-laki"> Laki-laki</label>
                    <label><input type="radio" name="gender" value="Perempuan"> Perempuan</label>
                </div>
            </div>

            <div class="form-group">
                <label for="jurusan">Jurusan</label>
                <select id="jurusan" name="jurusan">
                    <option value="">Pilih Jurusan</option>
                    <option value="Manajemen Informatika">Manajemen Informatika</option>
                    <option value="Rekayasa Keamanan Siber">Rekayasa Keamanan Siber</option>
                    <option value="Bisnis Digital">Bisnis Digital</option>
                </select>
            </div>

            <div class="form-group">
                <label for="foto">Foto Profil</label>
                <input type="file" id="foto" name="foto">
            </div>

            <div class="btn-container" style="justify-content: center;">
                <button type="submit" class="btn">Daftar</button>
                <a href="index.html" class="btn">Kembali</a>
            </div>
        </form>
    </main>

    <footer>
        <div>© 2026 FIRA AMALIA PUTRI - 2557401010 · Kelas MI 25</div>
        <div>
            <a href="#">Instagram</a>
            <a href="#">Email</a>
        </div>
    </footer>

</body>
</html>
